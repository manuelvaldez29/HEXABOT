<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Interconexión con el gemelo digital</title>
<style>
  html, body { margin: 0; background: #fff; }
  svg { display: block; font-family: "Segoe UI", Arial, sans-serif; }
  .caja { fill: #f4f6fb; stroke: #2b3a67; stroke-width: 2; }
  .nueva { fill: #fff4e6; stroke: #c05a12; stroke-width: 2.5; }
  .pc { fill: none; stroke: #2b3a67; stroke-width: 2; stroke-dasharray: 8 6; }
  .wb { fill: #eef7ef; stroke: #2e7d32; stroke-width: 2; }
  .tit { font-size: 18px; font-weight: 700; fill: #1b2547; }
  .sub { font-size: 14px; fill: #3a4466; }
  .lbl { font-size: 13.5px; fill: #8a3b12; font-weight: 600; }
  .lin { stroke: #8a3b12; stroke-width: 2.5; fill: none; }
  .ley { font-size: 14px; fill: #3a4466; }
</style></head><body>
<svg width="1400" height="600" viewBox="0 0 1400 600">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a3b12"/></marker>
  </defs>

  <rect class="pc" x="15" y="20" width="1370" height="500" rx="16"/>
  <text class="tit" x="35" y="50">PC con Windows 11 (el panel, el bridge y Webots pueden correr en la misma PC o en PCs distintas de la red)</text>

  <!-- Panel original -->
  <rect class="caja" x="35" y="170" width="215" height="180" rx="10"/>
  <text class="tit" x="142" y="205" text-anchor="middle">PanelControl1</text>
  <text class="sub" x="142" y="229" text-anchor="middle">ORIGINAL, sin cambios</text>
  <text class="sub" x="142" y="256" text-anchor="middle">Java 8 de 32 bits</text>
  <text class="sub" x="142" y="278" text-anchor="middle">RXTX 2.2pre2</text>
  <text class="sub" x="142" y="305" text-anchor="middle">reemplaza a la</text>
  <text class="sub" x="142" y="325" text-anchor="middle">Raspberry Pi</text>

  <!-- com0com -->
  <rect class="nueva" x="330" y="80" width="210" height="370" rx="10"/>
  <text class="tit" x="435" y="112" text-anchor="middle">com0com</text>
  <text class="sub" x="435" y="134" text-anchor="middle">3 pares de puertos</text>
  <text class="sub" x="435" y="153" text-anchor="middle">serie virtuales</text>
  <text class="tit" x="435" y="210" text-anchor="middle">COM10 ═ COM11</text>
  <text class="tit" x="435" y="280" text-anchor="middle">COM12 ═ COM13</text>
  <text class="tit" x="435" y="350" text-anchor="middle">COM14 ═ COM15</text>
  <text class="sub" x="435" y="410" text-anchor="middle">lo que entra por un</text>
  <text class="sub" x="435" y="429" text-anchor="middle">puerto sale por el otro</text>

  <path class="lin" d="M250,230 C290,230 290,205 345,205" marker-end="url(#f)" marker-start="url(#f)"/>
  <path class="lin" d="M250,260 L345,275" marker-end="url(#f)" marker-start="url(#f)"/>
  <path class="lin" d="M250,290 C290,290 290,345 345,345" marker-end="url(#f)" marker-start="url(#f)"/>
  <text class="lbl" x="292" y="190" text-anchor="middle">serie</text>

  <!-- bridge -->
  <rect class="nueva" x="620" y="150" width="210" height="220" rx="10"/>
  <text class="tit" x="725" y="190" text-anchor="middle">bridge.py</text>
  <text class="sub" x="725" y="214" text-anchor="middle">Python + pyserial</text>
  <text class="sub" x="725" y="250" text-anchor="middle">copia bytes serie ↔ TCP</text>
  <text class="sub" x="725" y="272" text-anchor="middle">sin interpretarlos</text>
  <text class="sub" x="725" y="306" text-anchor="middle">reconexión automática</text>
  <text class="sub" x="725" y="328" text-anchor="middle">registro de tráfico</text>

  <path class="lin" d="M540,205 C580,205 580,210 618,210" marker-end="url(#f)" marker-start="url(#f)"/>
  <path class="lin" d="M540,275 L618,262" marker-end="url(#f)" marker-start="url(#f)"/>
  <path class="lin" d="M540,345 C580,345 580,315 618,315" marker-end="url(#f)" marker-start="url(#f)"/>

  <!-- Webots -->
  <rect class="wb" x="920" y="80" width="445" height="420" rx="12"/>
  <text class="tit" x="1142" y="110" text-anchor="middle">Webots R2025a — hexabot.wbt</text>

  <rect class="nueva" x="945" y="130" width="190" height="300" rx="10"/>
  <text class="tit" x="1040" y="160" text-anchor="middle">hexabot_tcp.py</text>
  <text class="sub" x="1040" y="181" text-anchor="middle">controlador Python</text>
  <rect class="caja" x="962" y="200" width="156" height="58" rx="8"/>
  <text class="sub" x="1040" y="224" text-anchor="middle">Arduino virtual 1</text>
  <text class="sub" x="1040" y="245" text-anchor="middle">6 coxas</text>
  <rect class="caja" x="962" y="275" width="156" height="58" rx="8"/>
  <text class="sub" x="1040" y="299" text-anchor="middle">Arduino virtual 2</text>
  <text class="sub" x="1040" y="320" text-anchor="middle">patas 1 a 3</text>
  <rect class="caja" x="962" y="350" width="156" height="58" rx="8"/>
  <text class="sub" x="1040" y="374" text-anchor="middle">Arduino virtual 3</text>
  <text class="sub" x="1040" y="395" text-anchor="middle">patas 4 a 6</text>

  <path class="lin" d="M830,210 C880,210 900,229 960,229" marker-end="url(#f)" marker-start="url(#f)"/>
  <path class="lin" d="M830,262 C880,262 900,304 960,304" marker-end="url(#f)" marker-start="url(#f)"/>
  <path class="lin" d="M830,315 C880,315 900,379 960,379" marker-end="url(#f)" marker-start="url(#f)"/>
  <text class="lbl" x="875" y="180" text-anchor="middle">TCP 1001</text>
  <text class="lbl" x="868" y="250" text-anchor="middle">TCP 1002</text>
  <text class="lbl" x="866" y="365" text-anchor="middle">TCP 1003</text>

  <rect class="caja" x="1165" y="165" width="180" height="230" rx="10"/>
  <text class="tit" x="1255" y="198" text-anchor="middle">Modelo físico</text>
  <text class="sub" x="1255" y="226" text-anchor="middle">cuerpo + 6 patas</text>
  <text class="sub" x="1255" y="255" text-anchor="middle">18 motores</text>
  <text class="sub" x="1255" y="275" text-anchor="middle">rotativos</text>
  <text class="sub" x="1255" y="304" text-anchor="middle">18 sensores de</text>
  <text class="sub" x="1255" y="324" text-anchor="middle">posición</text>
  <text class="sub" x="1255" y="353" text-anchor="middle">GPS</text>
  <path class="lin" d="M1135,280 L1163,280" marker-end="url(#f)" marker-start="url(#f)"/>

  <!-- Leyenda -->
  <rect class="caja" x="35" y="545" width="26" height="18" rx="4"/>
  <text class="ley" x="70" y="559">preexistente (sin modificar)</text>
  <rect class="nueva" x="300" y="545" width="26" height="18" rx="4"/>
  <text class="ley" x="335" y="559">componente agregado para la virtualización</text>
  <rect class="wb" x="690" y="545" width="26" height="18" rx="4"/>
  <text class="ley" x="725" y="559">simulador</text>
</svg>
</body></html>
