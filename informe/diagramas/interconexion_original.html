<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Interconexión original</title>
<style>
  html, body { margin: 0; background: #fff; }
  svg { display: block; font-family: "Segoe UI", Arial, sans-serif; }
  .caja { fill: #f4f6fb; stroke: #2b3a67; stroke-width: 2; rx: 10; }
  .robot { fill: none; stroke: #2b3a67; stroke-width: 2; stroke-dasharray: 8 6; }
  .tit { font-size: 19px; font-weight: 700; fill: #1b2547; }
  .sub { font-size: 14.5px; fill: #3a4466; }
  .lbl { font-size: 14px; fill: #8a3b12; font-weight: 600; }
  .lin { stroke: #8a3b12; stroke-width: 2.5; fill: none; marker-end: url(#f); }
  .lin2 { stroke: #2b3a67; stroke-width: 2; fill: none; marker-end: url(#f2); }
</style></head><body>
<svg width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a3b12"/></marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a67"/></marker>
  </defs>

  <!-- Operador -->
  <rect class="caja" x="20" y="215" width="190" height="110"/>
  <text class="tit" x="115" y="258" text-anchor="middle">PC del operador</text>
  <text class="sub" x="115" y="284" text-anchor="middle">acceso remoto a la</text>
  <text class="sub" x="115" y="303" text-anchor="middle">interfaz gráfica</text>

  <path class="lin" d="M210,270 L298,270" marker-start="url(#f)"/>
  <text class="lbl" x="254" y="258" text-anchor="middle">Wi-Fi</text>

  <!-- Robot -->
  <rect class="robot" x="285" y="20" width="1095" height="520" rx="16"/>
  <text class="tit" x="305" y="50">HEXABOT (todo a bordo del robot)</text>

  <rect class="caja" x="310" y="190" width="250" height="160"/>
  <text class="tit" x="435" y="228" text-anchor="middle">Raspberry Pi</text>
  <text class="sub" x="435" y="256" text-anchor="middle">PanelControl1 (Java)</text>
  <text class="sub" x="435" y="278" text-anchor="middle">cinemática inversa</text>
  <text class="sub" x="435" y="300" text-anchor="middle">marcha en trípode</text>
  <text class="sub" x="435" y="322" text-anchor="middle">librería serie RXTX</text>

  <!-- Arduinos -->
  <g>
    <rect class="caja" x="700" y="80" width="250" height="100"/>
    <text class="tit" x="825" y="118" text-anchor="middle">Arduino MEGA 1</text>
    <text class="sub" x="825" y="144" text-anchor="middle">firmware ControlArduino4</text>
    <text class="sub" x="825" y="164" text-anchor="middle">PID de 6 actuadores</text>

    <rect class="caja" x="700" y="220" width="250" height="100"/>
    <text class="tit" x="825" y="258" text-anchor="middle">Arduino MEGA 2</text>
    <text class="sub" x="825" y="284" text-anchor="middle">firmware ControlArduino4</text>
    <text class="sub" x="825" y="304" text-anchor="middle">PID de 6 actuadores</text>

    <rect class="caja" x="700" y="360" width="250" height="100"/>
    <text class="tit" x="825" y="398" text-anchor="middle">Arduino MEGA 3</text>
    <text class="sub" x="825" y="424" text-anchor="middle">firmware ControlArduino4</text>
    <text class="sub" x="825" y="444" text-anchor="middle">PID de 6 actuadores</text>
  </g>
  <path class="lin" d="M560,240 C620,240 630,130 698,130" marker-start="url(#f)"/>
  <path class="lin" d="M560,270 L698,270" marker-start="url(#f)"/>
  <path class="lin" d="M560,300 C620,300 630,410 698,410" marker-start="url(#f)"/>
  <text class="lbl" x="598" y="168" text-anchor="middle">USB serie</text>
  <text class="lbl" x="628" y="262" text-anchor="middle">USB serie</text>
  <text class="lbl" x="598" y="390" text-anchor="middle">USB serie</text>
  <text class="sub" x="628" y="480" text-anchor="middle">115200 bps</text>
  <text class="sub" x="628" y="499" text-anchor="middle">texto ASCII</text>

  <!-- Actuadores -->
  <rect class="caja" x="1040" y="80" width="320" height="100"/>
  <text class="tit" x="1200" y="116" text-anchor="middle">6 coxas</text>
  <text class="sub" x="1200" y="142" text-anchor="middle">puentes H L298N · motores 24 V</text>
  <text class="sub" x="1200" y="162" text-anchor="middle">encoders · inicio de carrera</text>

  <rect class="caja" x="1040" y="220" width="320" height="100"/>
  <text class="tit" x="1200" y="256" text-anchor="middle">Fémur y tibia, patas 1 a 3</text>
  <text class="sub" x="1200" y="282" text-anchor="middle">puentes H L298N · motores 24 V</text>
  <text class="sub" x="1200" y="302" text-anchor="middle">encoders · inicio de carrera</text>

  <rect class="caja" x="1040" y="360" width="320" height="100"/>
  <text class="tit" x="1200" y="396" text-anchor="middle">Fémur y tibia, patas 4 a 6</text>
  <text class="sub" x="1200" y="422" text-anchor="middle">puentes H L298N · motores 24 V</text>
  <text class="sub" x="1200" y="442" text-anchor="middle">encoders · inicio de carrera</text>

  <path class="lin2" d="M950,130 L1038,130"/>
  <path class="lin2" d="M950,270 L1038,270"/>
  <path class="lin2" d="M950,410 L1038,410"/>
  <text class="sub" x="994" y="120" text-anchor="middle">PWM</text>
  <text class="sub" x="994" y="260" text-anchor="middle">PWM</text>
  <text class="sub" x="994" y="400" text-anchor="middle">PWM</text>
</svg>
</body></html>
